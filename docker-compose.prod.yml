services:
  postgres:
    image: postgres:16-alpine
    container_name: sgaob-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sgaob_db}
    ports:
      - "5432:5432"
    volumes:
      - sgaob-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgaob_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgaob-redis-prod
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - sgaob-redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sgaob-mailpit-prod
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 1000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sgaob-api-prod
    restart: always
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sgaob_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      AUTH_PROVIDER: ${AUTH_PROVIDER:-cognito}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID}
      COGNITO_DOMAIN: ${COGNITO_DOMAIN}
      COGNITO_JWKS_URI: ${COGNITO_JWKS_URI}
      JWT_SECRET: ${JWT_SECRET:-sgaob_jwt_dev_secret_key_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sgaob-web-prod
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  sgaob-postgres-prod-data:
    driver: local
  sgaob-redis-prod-data:
    driver: local
