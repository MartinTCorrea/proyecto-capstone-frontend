version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sgaob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgaob_db
    ports:
      - "5432:5432"
    volumes:
      - sgaob-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sgaob_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sgaob-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sgaob-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: sgaob-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  sgaob-postgres-data:
    driver: local
  sgaob-redis-data:
    driver: local

